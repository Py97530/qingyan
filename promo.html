<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>轻言漫画 · 宣传片</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1410;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'PingFang SC','Microsoft YaHei',sans-serif;color:#e8d8c0;gap:14px}
canvas{max-width:98vw;max-height:72vh;border-radius:12px;box-shadow:0 0 60px rgba(200,160,100,.2)}
.ctrls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
button{padding:10px 26px;border-radius:22px;border:none;font-size:.9rem;cursor:pointer;font-family:inherit;transition:all .15s;font-weight:600}
button:active{transform:scale(.95)}
.btn-play{background:#8a7a5a;color:#fff}
.btn-dl{background:#6a8a5a;color:#fff}
.btn-dl.recording{background:#c06050;animation:pulse .5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.progress{width:100%;max-width:640px;height:4px;background:#2a2018;border-radius:2px;overflow:hidden;cursor:pointer}
.progress .bar{height:100%;background:#c8a878;width:0%}
.info{font-size:.75rem;color:#8a7a6a}
.loading{color:#c8a878;font-size:1rem;margin:20px}
</style>
</head>
<body>

<div class="loading" id="loading">🌿 正在准备画面...</div>
<canvas id="c" width="1280" height="720" style="display:none"></canvas>

<div class="ctrls" id="ctrls" style="display:none">
  <button class="btn-play" id="btnPlay" onclick="togglePlay()">▶ 播放</button>
  <button class="btn-dl" id="btnDl" onclick="startExport()">⬇ 导出 MP4</button>
  <span class="info" id="info">00:00 / 00:35</span>
</div>
<div class="progress" id="progressBar" style="display:none" onclick="seek(event)">
  <div class="bar" id="bar"></div>
</div>
<p class="info" style="display:none" id="meta">1280×720 · 30fps · 约35秒 · 温馨治愈风</p>

<script>
// ═══════════════════════════════════════
// 轻言漫画宣传片 v2
// ═══════════════════════════════════════

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 1280, H = 720;
var DURATION = 35;
var FPS = 30;

var playing = false, currentTime = 0, rafId = null, playStart = 0, playBase = 0;

// ── 预加载壁纸 ──
var IMG_V = [], IMG_H = [];
var imgLoaded = 0, imgTotal = 20;

function loadImage(path, arr){
  var img = new Image();
  img.onload = function(){
    imgLoaded++;
    var el = document.getElementById('loading');
    if(el) el.textContent = '🌿 正在准备画面... ' + imgLoaded + '/' + imgTotal;
    if(imgLoaded >= imgTotal) startApp();
  };
  img.onerror = function(){
    imgLoaded++;
    if(imgLoaded >= imgTotal) startApp();
  };
  img.src = path;
  arr.push(img);
}

for(var i = 1; i <= 10; i++){
  var n = (i < 10 ? '0' : '') + i;
  loadImage('anime-wallpapers/thumb/' + n + '-ghibli.jpg', IMG_V);
}
for(var i = 1; i <= 10; i++){
  var n = (i < 10 ? '0' : '') + i;
  loadImage('weixin-wallpapers/thumb/' + n + '.jpg', IMG_H);
}

function startApp(){
  var el = document.getElementById('loading');
  if(el) el.style.display = 'none';
  canvas.style.display = 'block';
  document.getElementById('ctrls').style.display = 'flex';
  document.getElementById('progressBar').style.display = 'block';
  document.getElementById('meta').style.display = 'block';
  render(0);
}

// ── 工具 ──
function lerp(a,b,t){ return a+(b-a)*t }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)) }
function easeOut(t){ return 1-Math.pow(1-t,3) }
function easeInOut(t){ return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2 }
function easeBack(t){ var c=1.7;return (c+1)*t*t*t-c*t*t }

function drawText(ctx,text,x,y,size,color,align,glow){
  ctx.save();
  ctx.textAlign=align||'center';
  ctx.textBaseline='middle';
  ctx.font='bold '+size+'px "PingFang SC","Microsoft YaHei",sans-serif';
  if(glow){ ctx.shadowColor=color; ctx.shadowBlur=glow; }
  ctx.fillStyle=color;
  ctx.fillText(text,x,y);
  ctx.restore();
}

// ── 粒子 ──
var particles = [];
function spawnP(x,y,n,c,s,l){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2;
    particles.push({x:x,y:y,vx:Math.cos(a)*s*(.3+Math.random()),vy:Math.sin(a)*s*(.3+Math.random()),life:l*(.3+Math.random()*.7),maxLife:l,color:c,size:1.5+Math.random()*3});
  }
}
function updateP(dt){
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i]; p.x+=p.vx*dt*60; p.y+=p.vy*dt*60; p.life-=dt;
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawP(ctx){
  for(var i=0;i<particles.length;i++){
    var p=particles[i], a=p.life/p.maxLife;
    ctx.fillStyle = p.color.replace('1)', a+')');
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size*a, 0, Math.PI*2); ctx.fill();
  }
}

// ── 圆角图片 ──
function drawImg(ctx, img, x, y, w, h, r){
  ctx.save();
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r||8); ctx.clip();
  ctx.drawImage(img, x, y, w, h);
  ctx.restore();
}

// ── 温馨背景 ──
function warmBg(ctx){
  var grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, '#2a1c12');
  grd.addColorStop(0.5, '#352418');
  grd.addColorStop(1, '#1e1008');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);
}

function warmGlow(ctx, cx, cy, r, intensity){
  var grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  grd.addColorStop(0, 'rgba(255,220,180,'+(intensity*0.1)+')');
  grd.addColorStop(0.5, 'rgba(200,160,120,'+(intensity*0.04)+')');
  grd.addColorStop(1, 'rgba(30,20,14,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);
}

// ═══════════════════════════════════
// 场景1: 品牌开场 (0-4s)
// ═══════════════════════════════════
function drawScene1(t, local, prog){
  warmBg(ctx);
  warmGlow(ctx, W/2, H/2-30, 500, easeOut(prog));

  var tAlpha = clamp(prog*1.5, 0, 1);
  var tScale = lerp(1.3, 1, easeOut(clamp(prog*1.2,0,1)));
  ctx.save();
  ctx.globalAlpha = tAlpha;
  ctx.translate(W/2, H/2-20); ctx.scale(tScale, tScale);
  drawText(ctx, '轻言漫画', 0, 0, 68, '#f0d8b0', 'center', 40);
  ctx.restore();

  if(prog > 0.25){
    ctx.globalAlpha = clamp((prog-0.25)/0.5, 0, 1);
    ctx.fillStyle = '#c8b898';
    ctx.font = '20px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center'; ctx.fillText('QINGYAN  MANGA', W/2, H/2+55);
    ctx.globalAlpha = 1;
  }

  if(Math.random() < 0.2) spawnP(W/2+Math.random()*300-150, H/2+80, 1, 'rgba(240,200,160,1)', 12, 3);
  updateP(1/FPS); drawP(ctx);
}

// ═══════════════════════════════════
// 场景2: 宫崎骏美学 + 竖屏插图 (4-9s)
// ═══════════════════════════════════
function drawScene2(t, local, prog){
  warmBg(ctx);

  var cardW = 130, cardH = 232, gap = 40;
  var totalW = 3*cardW + 2*gap, startX = (W - totalW)/2, cardY = 200;

  for(var i = 0; i < 3; i++){
    var cp = easeOut(clamp((prog - i*0.2)/0.5, 0, 1));
    var cx = startX + i*(cardW+gap), cy = cardY + lerp(35, 0, cp);
    ctx.save(); ctx.globalAlpha = clamp(cp*1.5, 0, 1);
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
    ctx.fillStyle = '#f5efe0';
    ctx.beginPath(); ctx.roundRect(cx-2, cy-2, cardW+4, cardH+4, 10); ctx.fill();
    ctx.shadowColor = 'transparent';
    if(IMG_V[i] && IMG_V[i].complete) drawImg(ctx, IMG_V[i], cx, cy, cardW, cardH, 8);
    ctx.restore();
  }

  if(prog > 0.2){
    ctx.globalAlpha = clamp((prog-0.2)/0.5, 0, 1);
    drawText(ctx, '宫崎骏动漫美学', W/2, 110, 38, '#f0d8b0', 'center', 20);
    ctx.fillStyle = '#c8b090'; ctx.font = '18px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('原创插画 · 温暖治愈 · 油画细腻笔触', W/2, 150);
    ctx.fillText('竖屏手机壁纸 · 760×1280', W/2, 175);
    ctx.globalAlpha = 1;
  }
}

// ═══════════════════════════════════
// 场景3: 横屏插图 (9-14.5s)
// ═══════════════════════════════════
function drawScene3(t, local, prog){
  warmBg(ctx);
  var cardW = 360, cardH = 203, startX = (W - 2*cardW - 30)/2;

  for(var i = 0; i < 2; i++){
    var cp = easeOut(clamp((prog - i*0.22)/0.5, 0, 1));
    var cy = 200 + i*(cardH + 35);
    ctx.save(); ctx.globalAlpha = clamp(cp*1.5, 0, 1);
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
    ctx.fillStyle = '#f5efe0';
    ctx.beginPath(); ctx.roundRect(startX-2, cy-2, cardW+4, cardH+4, 10); ctx.fill();
    ctx.shadowColor = 'transparent';
    if(IMG_H[i] && IMG_H[i].complete) drawImg(ctx, IMG_H[i], startX, cy, cardW, cardH, 8);
    ctx.restore();
  }

  if(prog > 0.2){
    ctx.globalAlpha = clamp((prog-0.2)/0.5, 0, 1);
    drawText(ctx, '横屏桌面壁纸', W/2, 110, 38, '#f0d8b0', 'center', 20);
    ctx.fillStyle = '#c8b090'; ctx.font = '18px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('宫崎骏动漫美学 · 温暖治愈光影', W/2, 150);
    ctx.fillText('横屏桌面专属 · 2282×1280', W/2, 175);
    ctx.globalAlpha = 1;
  }
}

// ═══════════════════════════════════
// 场景4: 竖屏多图展示 (14.5-19s)
// ═══════════════════════════════════
function drawScene4(t, local, prog){
  warmBg(ctx);
  warmGlow(ctx, W/2, H/2, 400, 1);

  var cols = 3, imgW = 150, imgH = 267, gapX = 25, gapY = 20;
  var startX = (W - cols*imgW - (cols-1)*gapX)/2, startY = 50;

  for(var i = 0; i < 6; i++){
    var col = i % 3, row = Math.floor(i/3);
    var cx = startX + col*(imgW+gapX), cy = startY + row*(imgH+gapY);
    var cp = easeOut(clamp((prog - i*0.1)/0.6, 0, 1));
    ctx.save(); ctx.globalAlpha = clamp(cp*1.5, 0, 1);
    ctx.fillStyle = '#f5efe0';
    ctx.beginPath(); ctx.roundRect(cx-2, cy-2, imgW+4, imgH+4, 8); ctx.fill();
    var idx = i + 3;
    if(IMG_V[idx] && IMG_V[idx].complete) drawImg(ctx, IMG_V[idx], cx, cy, imgW, imgH, 6);
    ctx.restore();
  }

  if(prog > 0.1){
    ctx.globalAlpha = clamp((prog-0.1)/0.4, 0, 1);
    drawText(ctx, '✨ 每一张都独一无二', W/2, H-22, 22, '#e8d0a0', 'center', 8);
    ctx.globalAlpha = 1;
  }
}

// ═══════════════════════════════════
// 场景5: 完全免费 — 高潮 (19-25s)
// ═══════════════════════════════════
function drawScene5(t, local, prog){
  warmBg(ctx);
  warmGlow(ctx, W/2, H/2, 550, 1.5);

  // 背景插图淡影
  ctx.globalAlpha = 0.12;
  if(IMG_V[0] && IMG_V[0].complete) ctx.drawImage(IMG_V[0], 40, H-350, 150, 267);
  if(IMG_V[1] && IMG_V[1].complete) ctx.drawImage(IMG_V[1], W-190, H-350, 150, 267);
  if(IMG_H[0] && IMG_H[0].complete) ctx.drawImage(IMG_H[0], W/2-220, H/2-260, 440, 248);
  ctx.globalAlpha = 1;

  var chars = ['完', '全', '免', '费'];
  for(var i = 0; i < chars.length; i++){
    var ct = clamp((prog - 0.08 - i*0.2)/(0.24), 0, 1);
    if(ct <= 0) continue;
    var scale = easeBack(ct), alpha = clamp(ct*2, 0, 1);
    var cx = W/2 - (chars.length-1)*62 + i*124;
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.translate(cx, H/2-30); ctx.scale(scale, scale);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 90px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(200,160,100,0.8)'; ctx.shadowBlur = 40;
    ctx.fillText(chars[i], 0, 0);
    ctx.restore();
  }

  if(prog > 0.5){
    ctx.globalAlpha = clamp((prog-0.5)/0.4, 0, 1);
    var bw = 240, bh = 52, bx = W/2-bw/2, by = H/2+90;
    ctx.fillStyle = '#3a6a3a'; ctx.strokeStyle = '#6aaa6a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 26); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#a8e8b8'; ctx.font = 'bold 22px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center'; ctx.fillText('🎁 永久免费下载', W/2, by+bh/2);
    ctx.globalAlpha = 1;
  }

  if(prog > 0.65){
    ctx.globalAlpha = clamp((prog-0.65)/0.35, 0, 1);
    ctx.fillStyle = '#c8b898'; ctx.font = '18px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center'; ctx.fillText('无需赞赏 · 无需密码 · 直接下载', W/2, H/2+170);
    ctx.globalAlpha = 1;
  }
}

// ═══════════════════════════════════
// 场景6: 为什么选择 (25-30s)
// ═══════════════════════════════════
function drawScene6(t, local, prog){
  warmBg(ctx);

  var items = [
    {icon:'🎨', t:'原创插画', d:'100%原创 · 独一无二'},
    {icon:'✨', t:'高清画质', d:'细节丰富 · 色彩动人'},
    {icon:'⚡', t:'一键下载', d:'即点即得 · 无需等待'},
    {icon:'💛', t:'永久免费', d:'真心分享 · 不收一分'},
    {icon:'📱', t:'双尺寸', d:'竖屏手机 + 横屏桌面'}
  ];

  var startY = 120;
  for(var i = 0; i < items.length; i++){
    var it = clamp((prog - 0.05 - i*0.16)/0.4, 0, 1);
    if(it <= 0) continue;
    var y = startY + i*90 + lerp(25, 0, easeOut(it));
    ctx.globalAlpha = clamp(it*2, 0, 1);
    ctx.font = '34px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(items[i].icon, 260, y+8);
    ctx.fillStyle = '#f0d8b0'; ctx.font = 'bold 22px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'left'; ctx.fillText(items[i].t, 310, y-6);
    ctx.fillStyle = '#b8a088'; ctx.font = '16px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(items[i].d, 310, y+22);
    ctx.globalAlpha = 1;
  }

  if(prog > 0.1){
    ctx.globalAlpha = clamp((prog-0.1)/0.3, 0, 1);
    drawText(ctx, '为什么选择轻言漫画？', W/2, 60, 28, '#f0d8b0', 'center', 12);
    ctx.globalAlpha = 1;
  }
}

// ═══════════════════════════════════
// 场景7: 横屏多图展示 (30-33.5s)
// ═══════════════════════════════════
function drawScene7(t, local, prog){
  warmBg(ctx);
  warmGlow(ctx, W/2, H/2, 400, 1);

  var cols = 3, imgW = 280, imgH = 158, gapX = 20, gapY = 20;
  var startX = (W - cols*imgW - (cols-1)*gapX)/2, startY = 80;

  for(var i = 0; i < 6; i++){
    var col = i % 3, row = Math.floor(i/3);
    var cx = startX + col*(imgW+gapX), cy = startY + row*(imgH+gapY);
    var cp = easeOut(clamp((prog - i*0.1)/0.6, 0, 1));
    ctx.save(); ctx.globalAlpha = clamp(cp*1.5, 0, 1);
    ctx.fillStyle = '#f5efe0';
    ctx.beginPath(); ctx.roundRect(cx-2, cy-2, imgW+4, imgH+4, 8); ctx.fill();
    var idx = i + 4;
    if(IMG_H[idx] && IMG_H[idx].complete) drawImg(ctx, IMG_H[idx], cx, cy, imgW, imgH, 6);
    ctx.restore();
  }

  if(prog > 0.1){
    ctx.globalAlpha = clamp((prog-0.1)/0.4, 0, 1);
    drawText(ctx, '横屏 + 竖屏 · 任你选择', W/2, H-22, 22, '#e8d0a0', 'center', 8);
    ctx.globalAlpha = 1;
  }
}

// ═══════════════════════════════════
// 场景8: CTA (33.5-35s)
// ═══════════════════════════════════
function drawScene8(t, local, prog){
  warmBg(ctx);
  var pulse = Math.sin(prog*Math.PI*4)*.3+.7;
  warmGlow(ctx, W/2, H/2, 450, pulse);

  ctx.globalAlpha = clamp(prog*3, 0, 1);
  drawText(ctx, '轻言漫画', W/2, H/2-90, 56, '#f0d8b0', 'center', 30);
  ctx.globalAlpha = 1;

  if(prog > 0.15){
    ctx.globalAlpha = clamp((prog-0.15)/0.5, 0, 1);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 28px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(255,220,180,0.5)'; ctx.shadowBlur = 20;
    ctx.fillText('py97530.github.io/qingyan', W/2, H/2);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }

  if(prog > 0.35){
    var bProg = easeBack(clamp((prog-0.35)/0.5, 0, 1));
    var bw = 260, bh = 56, bx = W/2-bw/2, by = H/2+50;
    ctx.save(); ctx.globalAlpha = clamp(bProg, 0, 1);
    ctx.fillStyle = '#c8a878'; ctx.shadowColor = 'rgba(200,160,120,0.5)'; ctx.shadowBlur = 25*pulse;
    ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 28); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 22px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center'; ctx.fillText('👆 立即访问', W/2, by+bh/2);
    ctx.restore();
  }

  if(prog > 0.55){
    ctx.globalAlpha = clamp((prog-0.55)/0.45, 0, 1);
    ctx.fillStyle = '#c8b090'; ctx.font = '17px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center'; ctx.fillText('竖屏 + 横屏 · 宫崎骏美学 · 永久免费', W/2, H/2+150);
    ctx.globalAlpha = 1;
  }
}

// ═══════════════════════════════════
// 调度
// ═══════════════════════════════════
var scenes = [drawScene1, drawScene2, drawScene3, drawScene4, drawScene5, drawScene6, drawScene7, drawScene8];
var starts = [0, 4, 9, 14.5, 19, 25, 30, 33.5];

function getIdx(t){
  for(var i = starts.length-1; i >= 0; i--) if(t >= starts[i]) return i;
  return 0;
}

function render(t){
  ctx.clearRect(0, 0, W, H);
  var idx = getIdx(t);
  var local = t - starts[idx];
  var end = (idx < starts.length-1) ? starts[idx+1] : DURATION;
  scenes[idx](t, local, clamp(local/(end-starts[idx]), 0, 1));
  updateUI(t);
}

function updateUI(t){
  document.getElementById('bar').style.width = (t/DURATION*100)+'%';
  var m = Math.floor(t/60), s = Math.floor(t%60);
  document.getElementById('info').textContent =
    String(m).padStart(2,'0')+':'+String(s).padStart(2,'0') + ' / 00:35';
}

// ═══════════════════════════════════
// 播放
// ═══════════════════════════════════
function loop(){
  if(!playing) return;
  var elapsed = (performance.now() - playStart)/1000;
  currentTime = Math.min(playBase + elapsed, DURATION);
  render(currentTime);
  if(currentTime >= DURATION){
    currentTime = DURATION; playing = false;
    document.getElementById('btnPlay').textContent = '⟳ 重播';
    return;
  }
  rafId = requestAnimationFrame(loop);
}

function togglePlay(){
  if(playing){
    playing = false; if(rafId) cancelAnimationFrame(rafId);
    document.getElementById('btnPlay').textContent = '▶ 播放';
  } else {
    if(currentTime >= DURATION) currentTime = 0;
    playBase = currentTime; playStart = performance.now();
    playing = true;
    document.getElementById('btnPlay').textContent = '⏸ 暂停';
    rafId = requestAnimationFrame(loop);
  }
}

function seek(e){
  var rect = document.getElementById('progressBar').getBoundingClientRect();
  currentTime = clamp((e.clientX - rect.left)/rect.width * DURATION, 0, DURATION);
  render(currentTime);
}

// ═══════════════════════════════════
// 导出 MP4
// ═══════════════════════════════════
var mediaRecorder = null, recordedChunks = [];
function startExport(){
  var btn = document.getElementById('btnDl');
  if(mediaRecorder && mediaRecorder.state === 'recording'){
    mediaRecorder.stop(); return;
  }
  currentTime = 0; render(0);
  var stream = canvas.captureStream(FPS);
  var mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' :
             MediaRecorder.isTypeSupported('video/webm;codecs=vp8') ? 'video/webm;codecs=vp8' : 'video/webm';
  recordedChunks = [];
  mediaRecorder = new MediaRecorder(stream, {mimeType: mime, videoBitsPerSecond: 5000000});
  mediaRecorder.ondataavailable = function(e){ if(e.data.size>0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = function(){
    var blob = new Blob(recordedChunks, {type:'video/webm'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = '轻言漫画宣传片.webm'; a.click();
    URL.revokeObjectURL(url);
    btn.classList.remove('recording'); btn.textContent = '⬇ 导出 MP4';
    mediaRecorder = null; playing = false;
    if(rafId) cancelAnimationFrame(rafId);
    document.getElementById('btnPlay').textContent = '⟳ 重播';
    currentTime = DURATION;
  };
  mediaRecorder.start();
  btn.classList.add('recording'); btn.textContent = '⏹ 停止录制';
  playing = true; playBase = 0; playStart = performance.now();
  document.getElementById('btnPlay').textContent = '⏸ 暂停';
  function recordLoop(){
    if(!mediaRecorder || mediaRecorder.state !== 'recording'){ playing = false; return; }
    var elapsed = (performance.now() - playStart)/1000;
    currentTime = Math.min(elapsed, DURATION);
    render(currentTime);
    if(currentTime >= DURATION){ render(DURATION); mediaRecorder.stop(); return; }
    rafId = requestAnimationFrame(recordLoop);
  }
  rafId = requestAnimationFrame(recordLoop);
}

document.addEventListener('keydown', function(e){
  if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
  if(e.code==='ArrowLeft'){ currentTime = Math.max(0, currentTime-.5); render(currentTime); }
  if(e.code==='ArrowRight'){ currentTime = Math.min(DURATION, currentTime+.5); render(currentTime); }
});
</script>
